name: ${TEAM_NAME:-dev-crew}

# Dev Crew — Office-attached mode (DEFAULT).
#
# Agents join the Agent Office shared bus (external network agent-office-crew);
# no local Redis. Containers are lifecycle-controller-managed (restart: "no").
# The team keeps its private dev-cluster (dev-env / staging-env) for its own
# sandbox work; promotion to Office pre-prod goes through Super DevOps.
#
# Standalone mode (local Redis, always-on) is in docker-compose.standalone.yml.
#
# Env (from .env — see .env.example):
#   TEAM_NAME         instance id (default: dev-crew)
#   OFFICE_BUS_URL    Office Redis (default: redis://shared-memory:6379)
#   DEEPSEEK_API_KEY  LLM key (DeepSeek)
#   DOOR_SECRET_*     per-agent door HMAC secrets
#   DEV_PORT_*        host port overrides (defaults 8651–8654)
#
# Doors: POST /webhooks/inbox on 8644 in-container, host-mapped below.
# Each agent renders its config.yaml from config.yaml.template at start
# (render_config.py substitutes ${DOOR_SECRET} / ${CUSTOM_API_KEY}).

services:
  developer:
    image: dev-crew-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: ${TEAM_NAME:-dev-crew}-developer
    restart: "no"
    networks: [office, dev-env, staging-env]
    volumes:
      - ./agents/developer/hermes-home:/opt/data
      - ./agents/developer/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_DEVELOPER:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-dev-crew}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "${DEV_PORT_DEVELOPER:-8651}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-dev-crew}-qa
    restart: "no"
    networks: [office, dev-env]
    volumes:
      - ./agents/qa/hermes-home:/opt/data
      - ./agents/qa/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_QA:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-dev-crew}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "${DEV_PORT_QA:-8652}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  tech-pm:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-dev-crew}-tech-pm
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/tech-pm/hermes-home:/opt/data
      - ./agents/tech-pm/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_TECH_PM:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-dev-crew}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "${DEV_PORT_TECH_PM:-8653}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  devops:
    image: dev-crew-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: ${TEAM_NAME:-dev-crew}-devops
    restart: "no"
    networks: [office, staging-env]
    volumes:
      - ./agents/devops/hermes-home:/opt/data
      - ./agents/devops/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_DEVOPS:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-dev-crew}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "${DEV_PORT_DEVOPS:-8654}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

networks:
  office:
    external: true
    name: agent-office-crew
  dev-env:
    name: ${TEAM_NAME:-dev-crew}-dev-env
  staging-env:
    name: ${TEAM_NAME:-dev-crew}-staging-env

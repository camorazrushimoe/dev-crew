name: dev-crew

# Dev Crew — portable agent factory.
# 3 engineering agents (Hermes) + shared memory (Redis), one Docker project.
#
# Each agent is an isolated hermes-home mounted into /opt/data, plus its
# role skills mounted read-only as the "dev-crew" skill category.
# The webhook "door" listens on 8644 inside the container and is
# mapped to a distinct host port (8651/8652/8653).
#
# Start:
#   docker compose up -d
# Ping an agent:
#   docker exec dev-crew-developer hermes chat -q "hello"
#   python3 crew/crew-send.py developer "hello"

services:
  shared-memory:
    image: redis:7-alpine
    container_name: dev-crew-shared-memory
    restart: unless-stopped
    networks: [crew]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  developer:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-developer
    restart: unless-stopped
    networks: [crew]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/developer/hermes-home:/opt/data
      - ./agents/developer/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
    ports:
      - "8651:8644"
    command: ["gateway", "run"]

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-qa
    restart: unless-stopped
    networks: [crew]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/qa/hermes-home:/opt/data
      - ./agents/qa/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
    ports:
      - "8652:8644"
    command: ["gateway", "run"]

  tech-pm:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-tech-pm
    restart: unless-stopped
    networks: [crew]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/tech-pm/hermes-home:/opt/data
      - ./agents/tech-pm/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
    ports:
      - "8653:8644"
    command: ["gateway", "run"]

networks:
  crew:
    driver: bridge

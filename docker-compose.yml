name: dev-crew

# Dev Crew — portable agent factory.
# 4 engineering agents (Hermes) + shared memory (Redis) + generic environments.
#
# Each agent is an isolated hermes-home mounted into /opt/data, plus its
# role skills mounted read-only as the "dev-crew" skill category.
# The webhook "door" listens on 8644 inside the container and is
# mapped to a distinct host port (8651/8652/8653/8654).
#
# Generic environments (project-agnostic):
#   - dev-env      -> network "dev-crew-dev-env"     (dev/CI)
#   - staging-env  -> network "dev-crew-staging-env" (pre-prod)
# Networks start EMPTY. Projects bring their own compose
# (workspace/<project>/compose.yml) and attach via `external: true`.
# Agents reach project services over these networks by service name.
#
# Start:
#   docker compose up -d
# Ping an agent:
#   docker exec dev-crew-developer hermes chat -q "hello"
#   python3 crew/crew-send.py developer "hello"

services:
  shared-memory:
    image: redis:7-alpine
    container_name: dev-crew-shared-memory
    restart: unless-stopped
    networks: [crew]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  developer:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-developer
    restart: unless-stopped
    networks: [crew, dev-env, staging-env]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/developer/hermes-home:/opt/data
      - ./agents/developer/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "8651:8644"
    command: ["gateway", "run"]

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-qa
    restart: unless-stopped
    networks: [crew, dev-env, staging-env]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/qa/hermes-home:/opt/data
      - ./agents/qa/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "8652:8644"
    command: ["gateway", "run"]

  tech-pm:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-tech-pm
    restart: unless-stopped
    networks: [crew]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/tech-pm/hermes-home:/opt/data
      - ./agents/tech-pm/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace:ro
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "8653:8644"
    command: ["gateway", "run"]

  devops:
    image: nousresearch/hermes-agent:latest
    container_name: dev-crew-devops
    restart: unless-stopped
    networks: [crew, dev-env, staging-env]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/devops/hermes-home:/opt/data
      - ./agents/devops/skills:/opt/data/skills/dev-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
      # Host Docker daemon (read-only) so devops can bring up project compose files.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HERMES_UID=501
      - HERMES_GID=20
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_CONFIG_GLOBAL=/opt/data/.gitconfig
    ports:
      - "8654:8644"
    command: ["gateway", "run"]

networks:
  crew:
    driver: bridge
  dev-env:
    driver: bridge
    name: dev-crew-dev-env
  staging-env:
    driver: bridge
    name: dev-crew-staging-env
